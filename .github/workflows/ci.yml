name: CI

# Both long-lived branches, on both triggers. `development` is not decoration
# here: feature work merges there first and is promoted to `main` by a second
# PR, so a `development` base missing from either list is a class of change that
# runs no checks at all. That failure is silent in the worst way — a workflow
# that never triggers reports nothing, so the PR shows no red check, just no
# check, and branch protection has nothing to require.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # Which suites this change can actually affect. A docs or design-snapshot PR
  # cannot break a type check or an RLS policy, and the snapshot in particular is
  # ~35 MB of generated JSON that changes wholesale on every monthly refresh.
  #
  # Deliberately NOT a workflow-level `paths:` filter. That skips the workflow
  # entirely, so the check never reports — and a required status check that never
  # reports leaves the PR blocked forever. A job skipped by `if:` still reports,
  # and branch protection counts it as satisfied. That matters here because the
  # protection rule recommended in docs/HANDOFF.md requires both job names below.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge-base diff below needs history, not just the tip commit.
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A push to either long-lived branch is a deploy gate — `main` ships to
          # production, `development` to the DEV project — and both are rare.
          # Never narrow this.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running everything."
            exit 0
          fi

          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          # A DENYLIST of paths that cannot affect the app, not an allowlist of
          # paths that can — the same reasoning as the public-path list in
          # src/lib/auth/guard.ts. A new top-level directory therefore runs CI by default:
          # forgetting to list something costs one green run, never a missed break.
          if echo "$files" | grep -qvE '^(docs/|design/|openspec/|\.claude/|[^/]*\.md$)'; then
            app=true
          else
            app=false
          fi

          # ...with two carve-outs from the denylist.
          #
          # The first, added 2026-08-08: the squad briefs and the queue-pickup
          # procedure are EXECUTABLE process, not prose: a brief is the only
          # thing a fresh subagent reads, and it has no conversation history to
          # correct it. Three of ten were materially wrong at once — one told
          # the Realtime agent that the tables it was about to touch did not
          # exist — and nothing caught it, because the highest
          # blast-radius-per-line files in the repo were the only ones no job
          # ever looked at. src/__tests__/agent-briefs.test.ts is the tripwire,
          # and it only helps if a .claude/ change actually runs it.
          if echo "$files" | grep -qE '^\.claude/(agents|commands)/'; then
            app=true
            echo "-> .claude/agents or .claude/commands touched: running the app job for the brief tripwire"
          fi

          # The second, added by PD-155's review: scripts/docs/registry.mjs
          # anchors CLAUDE.md, docs/HANDOFF.md and docs/FIGMA-FIDELITY-TODO.md
          # prose with regexes that embed the current line wrapping — 28 of
          # its 33 claims live in files a docs-only PR edits (the other 5 are
          # in .claude/agents/, already covered by the carve-out above), and
          # none of it touches src/ or supabase/.
          # Review rewrapped one line, changed no number, and got a silent
          # SKIP with no red anywhere, because this exact class of PR was
          # denylisted out of the job that runs
          # scripts/docs/__tests__/registry.test.mjs's locate-integrity sweep.
          # This carve-out is about ANCHORS, not measurements: it makes the
          # anchor-integrity unit test run for the PR class that breaks
          # anchors. The measurements are a separate question, and the answer
          # changed — the "Doc claims (cheap)" step below now runs the claims
          # whose ground truth is a grep or a jq, while the ones needing
          # Postgres or a second full build stay out of CI as they always did.
          # Re-derive rather than trust these two numbers — count
          # `file:` occurrences per path in registry.mjs — since this comment
          # is exactly the kind of citation that goes stale as claims are
          # added.
          # The third, added 2026-08-10 with the cross-reference gate: openspec/
          # is denylisted, and roughly a third of the repo's file-qualified
          # "`file.md` §Section" pointers live inside it — every change cites
          # its own proposal.md, design.md and tasks.md. So the PR class most
          # able to break those pointers, an openspec-only change, ran zero
          # jobs and could never turn
          # scripts/docs/__tests__/crossrefs.test.mjs red. Same shape as the
          # carve-out above and the same reason: the tripwire only helps if the
          # diff that trips it runs the job. Count them rather than trusting the
          # fraction — resolveAll() reports `checked`, and its sources are every
          # tracked .md outside openspec/changes/archive/.
          if echo "$files" | grep -qE '^openspec/'; then
            app=true
          fi

          if echo "$files" | grep -qE '^docs/|^[^/]*\.md$'; then
            app=true
            echo "-> docs/ or a root *.md touched: running the app job for the doc-claim anchor sweep"
          fi

          # The fourth, added with the "Doc claims (cheap)" step below: that
          # step's hard-deny-entries claim MEASURES .claude/settings.json, and
          # a permissions change is exactly the diff that touches nothing else
          # — a session editing its own envelope has no reason to go near src/.
          # Without this the claim is re-evaluated on the next unrelated PR
          # instead, so the diff that broke it merges green and someone else
          # gets the red step. Deliberately settings.json alone and not all of
          # .claude/: hooks/*.sh has no claim reading it, and running a job
          # that checks nothing about the changed file is the same theatre in
          # the other direction.
          if echo "$files" | grep -qE '^\.claude/settings\.json$'; then
            app=true
            echo "-> .claude/settings.json touched: running the app job for the hard_deny claim"
          fi

          # The database job's inputs are the migration chain, the assertions,
          # and the seed check that runs beside them — so an allowlist is correct
          # here rather than merely cheap. `scripts/db/` is in it because the
          # seed checker lives there while everything it exercises lives under
          # supabase/; without it, a change to the checker itself runs nothing.
          if echo "$files" | grep -qE '^(supabase/|scripts/db/|\.github/workflows/)'; then
            db=true
          else
            db=false
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "-> app=$app db=$db"

  ci:
    name: Type Check, Lint & Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Runs before the build because it is fast and catches the drift that
      # matters most: the reserved-username list in src/lib/validation is
      # asserted against the CHECK constraint in the migration, and if those
      # disagree the client accepts a name the database rejects.
      - name: Unit tests
        run: npm run test:unit

      # The claims whose ground truth is a grep, a jq, a one-file vitest or a
      # contrast ratio — everything that needs neither Postgres nor a second
      # full build. `registry.test.mjs` (in the step above) proves each claim's
      # anchor still LOCATES; this proves the number it locates is still TRUE.
      # Those are different failures: a rewrapped line breaks the first, a
      # dependency added without touching the docs breaks only the second.
      #
      # Deliberately before the build, like the unit tests and for the same
      # reason: it is seconds, and a stale count should not wait behind two
      # minutes of Next.
      - name: Doc claims (cheap)
        run: npm run docs:check:cheap

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # PD-142 left the repo with two build shapes, and exactly one of them may
      # deploy. `CAPACITOR_BUILD=1` produces a static export: no server, so every
      # legacy `/postcards/<uuid>` link 404s (the redirects live in the web
      # config, and an export cannot run one) and `next/image` stops being
      # optimised. Nothing about that deploy looks red — it goes green — so
      # "CAPACITOR_BUILD is set in no Vercel target" needs an assertion rather
      # than a convention. This reads the output the step above just wrote, not
      # next.config.ts: a config that says the right thing and a build that did
      # it are different claims, and only the second one ships.
      - name: Assert the build is the web app, not the native bundle
        run: node scripts/native/assert-web-build.mjs

      # The step above guards only the inverse direction — that a web build did
      # not become an export. Without this one, nothing automated ever produces
      # the bundle PD-142 exists to make possible, and the property regresses
      # silently: the next PR adding an `[id]` route leaves `next build`, the
      # assertion above and `docs:check:cheap` all green (the `[ƒ●]` census is
      # `kind: 'build'`, which the cheap run excludes by design) while
      # `build:native` fails — discovered by whoever next tries to cut a store
      # binary.
      #
      # **Last is a correctness constraint, not a scheduling preference.** This
      # writes `out/` and `.next/export-detail.json`, which are exactly the two
      # conditions the step above fails on — so moving it earlier for speed
      # turns `assert-web-build.mjs` into a permanent red on a good build.
      - name: Build the native bundle and walk it
        run: npm run build:native
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Required for any CAPACITOR_BUILD=1 build (PD-188) — the webview
          # origin is https://localhost, which is on no redirect allowlist, so
          # `next.config.ts` fails the build rather than baking it in.
          #
          # **A literal rather than a secret, and this bundle is deliberately
          # not a release.** It is built to prove the export still works and is
          # thrown away; `design.md` §D7 allows exactly that. The gate that a
          # *submitted* bundle carries the production ref and origin is
          # `npm run release:check`, which is deliberately not part of
          # `build:native` — wiring it here would fail every PR, because this
          # step builds against DEV.
          NEXT_PUBLIC_CANONICAL_ORIGIN: https://app.letsride.social

  rls:
    name: RLS Policy Tests
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest

    # Matches the Postgres major version the Supabase project runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql is available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run RLS policy tests
        run: ./supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

      # The development seed is the only SQL here that runs by hand, so it is
      # the only SQL that rots without anyone finding out — the RLS suite has
      # its own fixtures and never touches it. A later migration adding a NOT
      # NULL column breaks it silently, and it gets discovered by whoever is
      # standing up DEV under time pressure. This also re-proves its production
      # guard still refuses, which is the half that would otherwise be assumed.
      - name: Check the development seed
        run: ./scripts/db/check-seed.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
