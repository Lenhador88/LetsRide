name: Supabase log digest

# WHY THIS IS SCHEDULED RATHER THAN RUN WHEN SOMETHING IS SUSPECTED.
# Supabase's free-tier log retention is about a day, and the Management API caps
# any single query at a 24-hour window. There is no backfill and no archive, so
# a day nobody reads is permanently gone. The worked example is PD-313's
# Discussions→Threads rename: 64 404s against `club_discussions` sat in that
# stream while `082` was ~50 minutes ahead of its deploy, nothing alerted, and
# they were found by accident the same afternoon. On PROD that window is
# rider-visible for the length of a build.
#
# TWICE DAILY, AND THE OVERLAP IS THE POINT. Each run reads the preceding 24
# hours, so runs 12 hours apart cover every minute twice. One skipped or failed
# run therefore loses nothing — which matters because GitHub's scheduled
# workflows are best-effort and are delayed or dropped under load. A single
# daily run would make every miss a permanent hole in exactly the record this
# exists to keep.
#
# `workflow_dispatch` is not a convenience. No shell in any build container can
# reach the Management API, so this workflow is the only thing that can execute
# the script at all — and a dispatch is how a fix gets tested without waiting
# 12 hours for the schedule. The transport test itself was NOT the first manual
# run: run 1, scheduled, 2026-08-31, already reached the API and was refused.
# See the VERIFICATION STATUS block in scripts/db/logs-errors.mjs.
#
# GitHub disables a repository's scheduled workflows after 60 days with no
# commits. This repo is far more active than that today; if it ever goes quiet,
# this stopping is silent.
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# Read-only: this job reports, it never writes to the repository.
permissions:
  contents: read

jobs:
  digest:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest

    # The job reads one HTTP endpoint. undici's 300s header timeout bounds most
    # of the risk, but the default ceiling is 360 MINUTES, which sits oddly
    # beside a step below that skips `npm ci` to save 40 seconds.
    timeout-minutes: 5

    strategy:
      # PROD is the half with riders. Without this, a red DEV cancels the PROD
      # job and the run reports a failure about the environment nobody uses
      # while saying nothing about the one that matters.
      fail-fast: false
      matrix:
        include:
          - label: DEV
            args: '--ci'
          - label: PRODUCTION
            args: '--ci --prod'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately no `npm ci`. The script imports only node builtins, so the
      # install would be ~40 seconds of the Actions minute budget, twice a day,
      # twice per run, to change nothing. Adding a dependency to this script is
      # what breaks that, so it is a property to keep rather than an accident.
      - name: Read the last 24h of failed requests
        run: node scripts/db/logs-errors.mjs ${{ matrix.args }}
        env:
          # An operator credential — a Supabase Management API personal access
          # token, not the publishable key and not the service-role key. It
          # reaches the whole account, so it lives here and in nothing that
          # ships.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # WHAT RED MEANS HERE, and it is two different pieces of news rather than
      # one. The script exits 1 for a 5xx, or a 404 or 300 under
      # /rest/v1/ — the shapes
      # that are always ours — and exits 2 when it could not look at all: no
      # token, no transport, an envelope it cannot read. Both redden the job,
      # deliberately; what matters is that the job summary always says which,
      # because a red run with an empty summary is the least legible way to
      # report "I did not look".
      #
      # Everything else is reported and never alerts. A 401 on
      # `has_password_reset_grant` is the guard working and a 403 is usually RLS
      # refusing correctly. An alert that fires on correct behaviour is one
      # nobody reads by the second week, which would leave this no better than
      # the nothing it replaces.
      #
      # EVERY RED SO FAR IS EXIT 2, AND NOT FOR THE REASON THIS BLOCK USED TO
      # PREDICT. It said the first red would be a missing `SUPABASE_ACCESS_TOKEN`
      # (PD-352's owner action). It was not: run 1 (2026-08-31) already had the
      # secret — masked in its own env block — and failed where all 14 runs since
      # have, on BOTH projects, with the API answering 200 and a body of
      # `{"error": "Backend error! Retry your query. ..."}`. So auth and
      # reachability are proven and the SQL is proven (the same constant returns
      # rows through the Supabase MCP `query_logs` tool); what is refused is the
      # query as this workflow poses it. PD-421 and
      # docs/reference/observability.md §The 24-hour expiry carry the bisect.
      # The split still earns its keep: it is what makes "could not look"
      # legible instead of indistinguishable from a production 5xx.
