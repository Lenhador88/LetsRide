name: Supabase log digest

# WHY THIS IS SCHEDULED RATHER THAN RUN WHEN SOMETHING IS SUSPECTED.
# Supabase's free-tier log retention is about a day, and the Management API caps
# any single query at a 24-hour window. There is no backfill and no archive, so
# a day nobody reads is permanently gone. The worked example is PD-313's
# Discussions→Threads rename: 64 404s against `club_discussions` sat in that
# stream while `082` was ~50 minutes ahead of its deploy, nothing alerted, and
# they were found by accident the same afternoon. On PROD that window is
# rider-visible for the length of a build.
#
# TWICE DAILY, AND THE OVERLAP IS THE POINT. Each run reads the preceding 24
# hours, so runs 12 hours apart cover every minute twice. One skipped or failed
# run therefore loses nothing — which matters because GitHub's scheduled
# workflows are best-effort and are delayed or dropped under load. A single
# daily run would make every miss a permanent hole in exactly the record this
# exists to keep.
#
# `workflow_dispatch` is not a convenience. The script's HTTP transport has
# never completed a live call from a shell (no Management API token exists in
# any build container), so the first manual run IS the transport test — see the
# VERIFICATION STATUS block in scripts/db/logs-errors.mjs.
#
# GitHub disables a repository's scheduled workflows after 60 days with no
# commits. This repo is far more active than that today; if it ever goes quiet,
# this stopping is silent.
on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# Read-only: this job reports, it never writes to the repository.
permissions:
  contents: read

jobs:
  digest:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      # PROD is the half with riders. Without this, a red DEV cancels the PROD
      # job and the run reports a failure about the environment nobody uses
      # while saying nothing about the one that matters.
      fail-fast: false
      matrix:
        include:
          - label: DEV
            args: '--ci'
          - label: PRODUCTION
            args: '--ci --prod'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deliberately no `npm ci`. The script imports only node builtins, so the
      # install would be ~40 seconds of the Actions minute budget, twice a day,
      # twice per run, to change nothing. Adding a dependency to this script is
      # what breaks that, so it is a property to keep rather than an accident.
      - name: Read the last 24h of failed requests
        run: node scripts/db/logs-errors.mjs ${{ matrix.args }}
        env:
          # An operator credential — a Supabase Management API personal access
          # token, not the publishable key and not the service-role key. It
          # reaches the whole account, so it lives here and in nothing that
          # ships.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # WHAT RED MEANS HERE, and why it is narrow. `--ci` exits 1 only for a 5xx
      # or a 404 under /rest/v1/ — the two shapes that are always ours. A 401 on
      # `has_password_reset_grant` is the guard working and a 403 is usually RLS
      # refusing correctly; both are printed into the job summary and neither
      # turns the run red. An alert that fires on correct behaviour is one
      # nobody reads by the second week, which would leave this no better than
      # the nothing it replaces.
